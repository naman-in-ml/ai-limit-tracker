name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Test Suite
        run: swift run ClaudeUsageTests

      - name: Compile Release Application
        run: swift build -c release --product ClaudeUsage

      - name: Package App Bundle
        run: |
          mkdir -p build/ClaudeUsage.app/Contents/MacOS
          mkdir -p build/ClaudeUsage.app/Contents/Resources
          cp .build/release/ClaudeUsage build/ClaudeUsage.app/Contents/MacOS/ClaudeUsage
          cp Info.plist build/ClaudeUsage.app/Contents/Info.plist
          if [ -f Resources/AppIcon.icns ]; then
            cp Resources/AppIcon.icns build/ClaudeUsage.app/Contents/Resources/AppIcon.icns
          fi
          cd build && zip -r ../ai-limit-tracker-macOS.zip ClaudeUsage.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-limit-tracker-macOS
          path: ai-limit-tracker-macOS.zip
